<!DOCTYPE html>
<html>
<head>
<meta charset="utf8">
    <style>
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
        }
        .tab button:hover {
            background-color: #ddd;
        }
        .tab button.active {
            background-color: #ccc;
        }
        .tabcontent {
            display: none;
            padding: 6px 12px;
            border: 1px solid #ccc;
            border-top: none;
        }
/*text colors*/
.red{color:red;}
.blue{color:blue;}
.orange{color:orange;}
    </style>
</head>
<body>
    <div class="tab">
        <button class="tablinks" onmouseover="openTab(event, 'Tab1')">Tab 1</button>
        <button class="tablinks" onmouseover="openTab(event, 'Tab2')">Tab 2</button>
        <button class="tablinks" onmouseover="openTab(event, 'Tab3')">Tab 3</button>
    </div>

    <div id="Tab1" class="tabcontent">
        <h3>Tab 1 Content</h3>
        <p class=red>This is the content of Tab 1.好的</p>
    </div>

    <div id="Tab2" class="tabcontent">
        <h3>Tab 2 Content</h3>
        <p class=blue>This is the content of Tab 2.</p>
    </div>

    <div id="Tab3" class="tabcontent">
        <h3>Tab 3 Content</h3>
        <p class=orange>This is the content of Tab 3.</p>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
        
        // 默认显示第一个标签页
        document.getElementById("Tab1").style.display = "block";
        document.getElementsByClassName("tablinks")[0].className += " active";
    </script>
</body>
</html>
