<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>学习时钟</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 20px 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            padding: 8px;
            width: 60px;
        }
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>学习认时间</h1>
    <div class="controls">
        <label>小时: <input type="number" id="hours" min="0" max="12" value="3"></label>
        <label>分钟: <input type="number" id="minutes" min="0" max="59" value="45"></label>
        <button onclick="updateClock()">设置时间</button>
    </div>
    <canvas id="clockCanvas" width="400" height="400"></canvas>

    <script>
/*
教你实现一个朴实的 Canvas 时钟效果
https://xie.infoq.cn/article/80aabd75d4d394544b01d3e4f
*/
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2 - 10;

        function drawClock(hours, minutes) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制时钟外圆
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, radius, 0, 2*Math.PI);
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 5;
            ctx.stroke();
            
            // 绘制时钟中心点
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 5, 0, 2*Math.PI);
            ctx.fillStyle = '#333';
            ctx.fill();
            
            // 绘制时钟数字
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                const angle = (i - 3) * (Math.PI * 2) / 12;
                const x = canvas.width/2 + Math.cos(angle) * (radius - 30);
                const y = canvas.height/2 + Math.sin(angle) * (radius - 30);
                ctx.fillText(i.toString(), x, y);
            }
            
            // 绘制时针
            const hourAngle = ((hours % 12) + minutes / 60) * (Math.PI * 2) / 12 - Math.PI/2;
            drawHand(hourAngle, radius * 0.5, 8, '#333');
            
            // 绘制分针
            const minuteAngle = minutes * (Math.PI * 2) / 60 - Math.PI/2;
            drawHand(minuteAngle, radius * 0.7, 4, '#333');
        }
        
        function drawHand(angle, length, width, color) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(centerX + Math.cos(angle) * length, centerY + Math.sin(angle) * length);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.stroke();
        }
        
        function updateClock() {
            const hours = parseInt(document.getElementById('hours').value) || 0;
            const minutes = parseInt(document.getElementById('minutes').value) || 0;
            drawClock(hours, minutes);
        }
        
        // 初始化时钟
        updateClock();
    </script>
</body>
</html>
